<style>

*{box-sizing:border-box;margin:0}
html,body{height:100%}

.phone{position:relative;width:390px;height:800px;max-height:96vh;border-radius:44px;border:10px solid var(--ph);overflow:hidden;background:var(--land);box-shadow:0 30px 80px #0005}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.map{position:absolute;inset:0}.map svg{width:100%;height:100%;display:block}

.chip[aria-pressed=true]{background:var(--accent);color:var(--on)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pin .b{display:flex;gap:4px;align-items:center;background:var(--card);border:3px solid var(--c);border-radius:18px;padding:3px 8px;font-weight:800;font-size:14px;box-shadow:0 3px 10px #0004}
.pin .b i{font-style:normal;font-size:11px;color:var(--ev);font-weight:800}

.fab button{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px #0003;font-size:19px}
.fab button[aria-pressed=true]{background:var(--accent);color:var(--on)}

.sheet.hide{transform:translateY(105%)}
.grab{display:block;box-sizing:content-box;width:40px;height:4px;border:10px solid transparent;background:color-mix(in srgb,var(--mut) 40%,transparent);background-clip:padding-box;border-radius:14px;margin:-6px auto 2px}.cv{width:30px;height:30px;border-radius:50%;background:var(--land);font-size:16px;line-height:1}.promo{margin-top:10px;border-radius:12px;padding:8px 12px;font-size:13px;background:color-mix(in srgb,#e8590c 14%,transparent);color:#c2410c}.tg{position:absolute;top:-9px;right:-8px;width:18px;height:18px;border-radius:50%;background:#d9480f;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0004}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .promo{color:#ff9a5c}}

.info span{color:var(--mut)}.info b{display:block;color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:46px;border-radius:14px;font-weight:800;background:var(--accent);color:var(--on)}

.det{margin-top:12px;display:grid;gap:8px}
.cd{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
.cd h3{font-size:14px;display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--c)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--land);border-radius:10px;padding:4px 9px;font-size:12px}
.ov{position:absolute;inset:0;z-index:20;background:#000a;overflow-y:auto;display:flex;padding:16px}
.dlg{margin:auto;background:var(--card);border-radius:24px;padding:22px;width:100%}
.dlg h2{font-size:24px;font-weight:800}.dlg p{color:var(--mut);font-size:14px;margin:4px 0 14px}
.f{display:block;margin-bottom:10px;font-size:13px;font-weight:600}
.f input{display:block;width:100%;height:46px;margin-top:4px;border-radius:12px;border:2px solid var(--line);background:var(--land);color:var(--ink);padding:0 12px;font:inherit}
.f.err input{border-color:var(--bad)}.f em{display:none;color:var(--bad);font-style:normal;font-weight:600;font-size:12px}.f.err em{display:block}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.soc{display:grid;gap:8px}.soc button{height:44px;border-radius:12px;border:2px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}.soc svg{width:20px;height:20px;flex:none}

.top{transition:padding .25s}.tt .top{padding-top:68px}.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--card);padding:8px 14px;border-radius:14px;font-size:13px;font-weight:600;max-width:88%;text-align:center}

let N=null,raf=0,last=0,toastT=0,R={pts:0,free:0,used:0};const M=2.5,fmt=m=>m>=1000?(m/1000).toFixed(1)+" km":Math.round(m)+" m";
const pathD=g=>"M180 577"+g.rt.map(p=>" L"+p.join(" ")).join("");
function posAt(d){const c=N.cum,p=N.pts;let i=1;while(i<c.length-1&&c[i]<d)i++;const t=Math.min(1,(d-c[i-1])/(c[i]-c[i-1]||1));return[p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t]}
function stopNav(){cancelAnimationFrame(raf);raf=0;N=null;const c=$("car");c.hidden=true;c.classList.remove("near")}
function selectG(id){if(N&&S.sel!==id){stopNav();toast("Navigation reset")}S.sel=id;S.more=false;S.min=false;render()}
function place(){const g=G.find(x=>x.id===N.gid),[x,y]=posAt(N.d),rem=(N.total-N.d)*M,c=$("car");c.style.left=x/3.6+"%";c.style.top=y/7.8+"%";$("cl").textContent=fmt(rem);const e=$("rem");if(e)e.textContent=fmt(rem);
 if(!N.near&&rem<200){N.near=true;c.classList.add("near");toast("Approaching "+g.n)}
 if(!N.close&&rem<50){N.close=true;toast("You are close. Please confirm your arrival.");render()}}
function tick(now){if(!N)return;const dt=Math.min(.1,(now-last)/1000);last=now;N.d=Math.min(N.total,N.d+20*dt);place();if(N&&N.d<N.total)raf=requestAnimationFrame(tick)}
function startNav(){const g=G.find(x=>x.id===S.sel);if(!g)return;stopNav();const p=[[180,577],...g.rt],cum=[0];for(let i=1;i<p.length;i++)cum.push(cum[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));N={gid:g.id,pts:p,cum,total:cum[cum.length-1],d:0,near:false,close:false,ok:false,booked:false};S.min=true;$("car").hidden=false;toast("Navigation started: "+fmt(N.total*M)+" to "+g.n);render();place();last=performance.now();raf=requestAnimationFrame(tick)}
function arrive(){if(!N||!N.close)return;N.ok=true;toast("Arrival confirmed. You can now book your parking.");render()}
function prog(n){return `<div class="pg" role="img" aria-label="${n} of 5 bookings">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`}
function bookIt(){if(!N||!N.ok||N.booked)return;N.booked=true;const use=R.free>R.used;if(use)R.used++;R.pts++;const n=R.pts%5||5,win=R.pts%5===0;if(win)R.free++;N.rw={n,win,use};toast("Parking booked at "+G.find(x=>x.id===N.gid).n+"."+(use?" Your 1st hour is free!":"")+" +1 point, "+n+"/5 toward your free hour."+(win?" Reward unlocked!":""));render();if(win)reward()}
function reward(){const ov=document.createElement("div");ov.className="ov";ov.innerHTML=`<div class="dlg" role="dialog" aria-label="Reward unlocked" style="text-align:center"><div style="color:var(--ok)">${ic("sparkles",48)}</div><h2>Reward unlocked!</h2><p>5/5 bookings complete. You earned 1 free hour of parking.<br>Total free hours: <b>${R.free}</b></p><button class="btn" style="width:100%">Great</button></div>`;ov.onclick=e=>{if(e.target.closest("button"))ov.remove()};$("app").append(ov)}
function profile(){const ov=document.createElement("div");ov.className="ov";const n=R.pts%5;ov.innerHTML=`<div class="dlg" role="dialog" aria-label="Profile"><h2>${S.user}</h2><p>ParkPulse Rewards</p><div class="cd"><h3><span>${ic("sparkles",16)} Total points</span><b>${R.pts}</b></h3>1 point for every parking booking</div><div class="cd" style="margin-top:8px"><h3>Next reward <b>${n}/5</b></h3>${prog(n)}${5-n} more booking${5-n>1?"s":""} until 1 free hour</div><div class="cd" style="margin-top:8px"><h3><span>${ic("clock",16)} Free hours earned</span><b>${R.free} h</b></h3>${R.used} h redeemed · ${R.free-R.used} h available</div><div class="row" style="margin-top:14px"><button class="btn o" id="so">Sign out</button><button class="btn">Close</button></div></div>`;ov.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="so"){S.user=null;$("avb").innerHTML=ic("user",22);toast("Signed out")}ov.remove()};$("app").append(ov)}
function navBox(g){if(!N||N.gid!==g.id)return"";const rem=(N.total-N.d)*M;return `<div class="nv"><span>${ic("car",15)} Remaining <b id="rem">${fmt(rem)}</b></span><span>${N.ok?"Arrival confirmed":"En route"}</span></div>${N.close&&!N.ok?`<button class="btn" id="arr" style="width:100%;margin-bottom:8px;background:var(--ok);color:var(--on)">I’ve arrived at the parking garage</button>`:""}<button class="btn" id="book" style="width:100%" ${N.ok&&!N.booked?"":"disabled"}>${N.booked?"Parking booked ✓":"Book parking"}</button>${N.rw?`${N.rw.use?`<div class="fh">${ic("clock",32)}<div><b>1st hour free</b><span>ParkPulse Rewards applied to this booking</span></div></div>`:""}<div class="nv" style="margin:10px 0 0"><span>${ic("sparkles",15)} +1 point</span><span><b>${N.rw.n}/5</b> toward free hour</span></div>${prog(N.rw.n)}${N.rw.win?`<div class="promo" style="margin-top:0">${ic("sparkles",15)} Reward unlocked: 1 free hour of parking</div>`:""}`:""}`}
